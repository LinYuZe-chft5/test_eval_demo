# Cloudflare Pages 部署配置
# 文档: https://developers.cloudflare.com/pages/framework-guides/deploy-a-nextjs-site/
# 
# 部署步骤：
# 1. 在 Cloudflare Dashboard 创建 Pages 项目
# 2. 连接 GitHub 仓库
# 3. 配置以下构建设置
# 4. 添加环境变量（见下方 env 部分）
# 5. 触发部署

buildCommand: 'next build'
outputDirectory: '.next'
installCommand: 'npm install'
framework: 'nextjs'

# 环境变量（在 Cloudflare Dashboard > Pages > Settings > Environment variables 中配置）
# 注意：敏感密钥必须在 Cloudflare Dashboard 中配置，不要写入代码仓库
env:
  production:
    NEXT_PUBLIC_SUPABASE_URL: 'https://qoagemxoijruustccapl.supabase.co'
    SUPABASE_SERVICE_ROLE_KEY: '<在Cloudflare Dashboard中配置>'
    LLM_API_URL: 'https://ddshub.cc/v1'
    LLM_API_KEY: '<在Cloudflare Dashboard中配置>'
    LLM_MODEL: 'gpt-5.6-terra'
    NODE_ENV: 'production'
  preview:
    NEXT_PUBLIC_SUPABASE_URL: 'https://qoagemxoijruustccapl.supabase.co'
    SUPABASE_SERVICE_ROLE_KEY: '<在Cloudflare Dashboard中配置>'
    LLM_API_URL: 'https://ddshub.cc/v1'
    LLM_API_KEY: '<在Cloudflare Dashboard中配置>'
    LLM_MODEL: 'gpt-5.6-terra'
    NODE_ENV: 'preview'
