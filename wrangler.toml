# ==========================================================
# ⚠️ 禁止在此文件中添加 [vars] 块！
# Cloudflare wrangler deploy 时：本地 wrangler.toml 的 [vars] 优先级 > Dashboard 配置的变量，
# 会导致 Dashboard 里配置的 NEXT_PUBLIC_SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY 等密钥被覆盖清空，
# 运行时抛出 SupabaseConfigError → 前端显示「系统正在维护中，请稍后再试」。
# 所有环境变量请统一在 Cloudflare Dashboard → Settings → Environment variables 中配置（推荐 Text 类型）。
# ==========================================================

name = "test-eval-demo"
compatibility_date = "2025-01-01"
# ⚠️ streams_enable_constructors 自2022-11-30已是默认启用，手动指定会被Cloudflare API拒绝(code=10021)
compatibility_flags = [ "nodejs_compat" ]

# Worker 主入口（OpenNext 产出路径）
main = ".open-next/worker.js"

# 静态资源目录（Tailwind CSS、Next.js JS bundle、图片/字体）
# 解决 Workers 部署页面无样式问题（CSS 404）
[assets]
directory = ".open-next/assets"
